name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Legal_Mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Legal_Mcp/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m py_compile app.py tasks.py rag.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sahayai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sahayai/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
